# dbNSFP source manifest.
#
# Source: academic download (dbNSFP5.3.1a, GRCh38, VEP/SnpEff-ready BGZF format,
# tabix-indexed). https://sites.google.com/site/jpopgen/dbNSFP
# VEP plugin: https://github.com/Ensembl/VEP_plugins/blob/release/116/dbNSFP.pm
#
# 505 columns, 1-based GRCh38 coords, bare (non-`chr`-prefixed) contigs, sorted
# by chrom/pos (same layout VEP's dbNSFP.pm expects for tabix). Only missense /
# stop_gained / stop_lost / start_lost variants carry data (dbNSFP is keyed on
# amino-acid change, one row per (chrom,pos,alt,aaref,aaalt) combination, with
# all matching Ensembl transcript IDs folded into that row's `;`-joined lists).
#
# VEP's dbNSFP.pm default behavior (no plugin params) that this manifest
# reproduces:
#   - pep_match=1 (default ON): match requires aaref/aaalt equality too, not
#     just genomic position + allele — dbNSFP can carry multiple rows at the
#     same (pos,alt) for different amino-acid contexts (different transcripts'
#     reading frames). Mirrors AlphaMissense's protein_variant match_column.
#   - transcript_match=0 (default OFF): value columns are returned AS-IS
#     (whole `;`-joined multi-transcript string, `;`->`,` and `|`->`&`
#     replaced) rather than resolved to one transcript by index — no
#     per-transcript array-explode needed here, unlike a transcript_match=1
#     setup would require.
#   - dbNSFP's own aaref/aaalt use `X` for a stop codon; VEP's Amino_acids
#     representation uses `*`. The plugin does `s/X/\*/g` before comparing to
#     `pep_allele_string()` — replicated in the match-key CASE expression below
#     so stop_gained/stop_lost/start_lost rows still match the engine's
#     ref_aa/alt_aa attributes.
#   - `.` denotes "no value" in dbNSFP; VEP's plugin skips such fields from its
#     output hash entirely (empty CSQ subfield). Replicated via NULLIF.
#
# Value columns here are a representative subset (SIFT, Polyphen2-HDIV, REVEL,
# CADD_phred, GERP++_RS) rather than all 505 — mirrors the scoped-column usage
# pattern of real `--plugin dbNSFP,file,col1,col2,...` invocations; VEP users
# never request all columns in practice.

plugin_name       = "dbnsfp"
coordinate_system = "1-based"
ingest_sql = """
SELECT
    "chr" AS chrom,
    CAST("pos(1-based)" AS INT) AS start,
    CAST("pos(1-based)" AS INT) AS end,
    concat("ref", '/', "alt") AS allele_string,
    concat(
        replace("aaref", 'X', '*'),
        '/',
        replace("aaalt", 'X', '*')
    ) AS aa_change,
    NULLIF(replace(replace("SIFT_score", ';', ','), '|', '&'), '.') AS sift_score,
    NULLIF(replace(replace("SIFT_pred", ';', ','), '|', '&'), '.') AS sift_pred,
    NULLIF(replace(replace("Polyphen2_HDIV_score", ';', ','), '|', '&'), '.') AS polyphen2_hdiv_score,
    NULLIF(replace(replace("Polyphen2_HDIV_pred", ';', ','), '|', '&'), '.') AS polyphen2_hdiv_pred,
    NULLIF(replace(replace("REVEL_score", ';', ','), '|', '&'), '.') AS revel_score,
    NULLIF(replace(replace("CADD_phred", ';', ','), '|', '&'), '.') AS cadd_phred,
    NULLIF(replace(replace("GERP++_RS", ';', ','), '|', '&'), '.') AS gerp_rs
FROM plugin_dbnsfp_src
"""

[[source]]
provider = "csv"
# Overridden at build time with --source-path (a tabix-extracted per-chrom
# subset of the full BGZF file — the full file is 46.8GB compressed with a
# huge per-column-count schema; per-chrom tabix extraction, plain/uncompressed,
# avoids the plugin-cache full-file decompress-to-temp bottleneck entirely).
