# ClinVar source manifest.
#
# Source: https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/archive_2.0/2026/clinvar_20260706.vcf.gz
#         (the 2026-07-06 weekly release; clinvar.vcf.gz at the top level moves weekly)
# VEP usage: not a --plugin, a --custom annotation, e.g.
#   --custom clinvar.vcf.gz,ClinVar,vcf,exact,0,CLNSIG,CLNREVSTAT,CLNDN,CLNVC,CLNVI
#
# Real VEP's --custom convention emits a 6th, bare `ClinVar` CSQ field (the
# short_name itself, no subfield name) populated from the source VCF's ID
# column -- not just the 5 named CLNSIG/CLNREVSTAT/CLNDN/CLNVC/CLNVI fields.
# Without it, vepyr's CSQ header has 5 clinvar fields where real VEP's has 6,
# which fails vepyr_diffly's exact-field-set comparison. So %ID must be
# extracted too.
#
# `ProviderKind::Vcf` is used directly here -- no bcftools/awk preprocessing,
# self-contained. A sparse plugin like ClinVar (far fewer rows per chromosome
# than the variation shard) can land on either side of an adaptive join.
# Input and join order do not affect correctness: the builder's final
# DataFusion query applies `ORDER BY tier, start` and verifies monotonicity
# before publishing the shard.
#
# `array_to_string(..., ',')` on CLNSIG/CLNREVSTAT/CLNDN/CLNVI: the VCF
# provider exposes Number=. INFO fields as `List<Utf8>` (even when a given
# record only has one element), so referencing them bare renders as
# `[Uncertain_significance]` instead of `Uncertain_significance`. CLNVC is
# Number=1 (scalar) and must NOT be wrapped -- `array_to_string` on a
# non-list column is a type error.
#
# `record_layout = true` carries the per-record `_vcf_info_keys` list. Typed
# INFO columns alone cannot distinguish an explicit `CLNDN=.` from an absent
# CLNDN key because both parse to Arrow null. VEP `--custom` preserves the
# explicit dot but emits an empty CSQ field for an absent key, so each selected
# INFO value below restores `.` only when its key was actually present.
#
# `UNNEST(string_to_array(alt, '|'))` splits a multiallelic record's `alt`
# (the VCF provider pipe-joins multiple ALTs into one string, e.g. "A|C" for
# a raw-VCF "A,C") into one row per allele, so a multiallelic line can never
# silently build a garbage allele_string like "G/A|C" that no single-allele
# runtime probe can match. Defensive: the current clinvar.vcf.gz has 0
# multiallelic records (checked via `bcftools norm -m -` count), but the
# split has to happen here rather than in a flatten pre-pass since VCF is the
# live path now. If a future release introduces multiallelic rows, re-check
# each selected INFO field's `Number=` declaration and use correlated
# `arrays_zip` expansion for any `Number=A`/`Number=R` values; ALT-only unnest
# must not duplicate an allele-indexed array across every ALT.
#
# `ALT = "."` (VCF's "no called alternate allele" marker) comes back as an
# empty string from this provider, not the literal `.` character -- it
# parses VCF semantics rather than echoing raw text. A `bcftools query`-based
# reference build would keep the literal `.` instead; that's a
# source-parsing difference to expect, not a defect in either path.
#
# hg38, 1-based, bare (non-`chr`-prefixed) contigs — matches the variation
# cache's contig convention natively. Per-variant (no [[match_column]]):
# ClinVar annotates the variant itself, not a per-transcript amino-acid
# change, so the same value applies to every transcript line (VEP's --custom
# behavior).

plugin_name       = "clinvar"
coordinate_system = "1-based"
field_order       = "declared"
# VEP's --custom VCF source minimises alleles before comparing (verified on
# chr1:65364614 GT>TT, which it matches to ClinVar's G>T row 1258041). The
# "exact" in --custom ...,exact is the overlap mode, not the allele rule.
allele_match      = "minimised"
# Runtime probes with the engine's `vcf_to_vep_input_allele()` form, not raw
# VCF ref/alt (see annotate_provider.rs:5599-5602, allele.rs:340-369): for an
# indel whose REF/ALT share a leading anchor base, it strips that one base
# from both and shifts `start` by +1 (no suffix trimming, unlike the full VEP
# allele-minimization used elsewhere). SNVs and MNVs are untouched. Without
# this, every indel's stored (start, allele_string) misses the runtime probe
# even though the underlying data is correct — confirmed empirically: 502
# ClinVar hits on chr21, 448/448 SNVs matched, 0/54 indels matched, before this
# fix.
ingest_sql = """
WITH exploded AS (
    SELECT chrom,
           CAST(start AS INT) AS pos,
           ref,
           unnest(string_to_array(alt, '|')) AS alt,
           id,
           CASE
               WHEN "CLNSIG" IS NOT NULL THEN array_to_string("CLNSIG", ',')
               WHEN strpos(concat(';', "_vcf_info_keys", ';'), ';CLNSIG;') > 0 THEN '.'
           END AS clnsig,
           CASE
               WHEN "CLNREVSTAT" IS NOT NULL THEN array_to_string("CLNREVSTAT", ',')
               WHEN strpos(concat(';', "_vcf_info_keys", ';'), ';CLNREVSTAT;') > 0 THEN '.'
           END AS clnrevstat,
           CASE
               WHEN "CLNDN" IS NOT NULL THEN array_to_string("CLNDN", ',')
               WHEN strpos(concat(';', "_vcf_info_keys", ';'), ';CLNDN;') > 0 THEN '.'
           END AS clndn,
           CASE
               WHEN "CLNVC" IS NOT NULL THEN "CLNVC"
               WHEN strpos(concat(';', "_vcf_info_keys", ';'), ';CLNVC;') > 0 THEN '.'
           END AS clnvc,
           CASE
               WHEN "CLNVI" IS NOT NULL THEN array_to_string("CLNVI", ',')
               WHEN strpos(concat(';', "_vcf_info_keys", ';'), ';CLNVI;') > 0 THEN '.'
           END AS clnvi
    FROM plugin_clinvar_src
),
trimmed AS (
    SELECT chrom,
           pos,
           ref,
           alt,
           (length(ref) <> 1 OR length(alt) <> 1)
               AND substr(ref, 1, 1) = substr(alt, 1, 1) AS is_shifted,
           id, clnsig, clnrevstat, clndn, clnvc, clnvi
    FROM exploded
)
SELECT chrom,
       CASE WHEN is_shifted THEN pos + 1 ELSE pos END AS start,
       CASE WHEN is_shifted THEN pos + 1 ELSE pos END AS end,
       concat(
           CASE WHEN is_shifted
                THEN CASE WHEN length(substr(ref, 2)) = 0 THEN '-' ELSE substr(ref, 2) END
                ELSE ref END,
           '/',
           CASE WHEN is_shifted
                THEN CASE WHEN length(substr(alt, 2)) = 0 THEN '-' ELSE substr(alt, 2) END
                ELSE alt END
       ) AS allele_string,
       id,
       clnsig,
       clnrevstat,
       clndn,
       clnvc,
       clnvi
FROM trimmed
"""

[[source]]
provider = "vcf"
# Overridden at build time with --source-path (the raw clinvar.vcf.gz).
path = "clinvar.vcf.gz"
# `clinvar.vcf.gz` at the top-level FTP path is a moving weekly target; the
# URL pins the dated 2026-07-06 release this cache was built and validated
# from. Upstream MD5 (clinvar_20260706.vcf.gz.md5 alongside it).
url = "https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/archive_2.0/2026/clinvar_20260706.vcf.gz"
md5 = "f78d25d49e17a070957a127e409f87b9"
index = "tabix"
record_layout = true

# Field order/names match the VEP --custom short_name_field convention
# (ClinVar_CLNSIG, ...) used in vepyr_diffly's plugins.py for the golden run.
# `ClinVar` (bare, no subfield name) is VEP's own --custom short_name marker
# field, populated from the source VCF's ID column.
[[value_columns]]
column = "id"
csq_field = "ClinVar"
type = "Utf8"

[[value_columns]]
column = "clnsig"
csq_field = "ClinVar_CLNSIG"
type = "Utf8"

[[value_columns]]
column = "clnrevstat"
csq_field = "ClinVar_CLNREVSTAT"
type = "Utf8"

[[value_columns]]
column = "clndn"
csq_field = "ClinVar_CLNDN"
type = "Utf8"

[[value_columns]]
column = "clnvc"
csq_field = "ClinVar_CLNVC"
type = "Utf8"

[[value_columns]]
column = "clnvi"
csq_field = "ClinVar_CLNVI"
type = "Utf8"
